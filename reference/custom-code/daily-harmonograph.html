<style>
.nb-viz-hint{
  margin-top:10px;
  font-size:12px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  opacity:0.65;
  user-select:none;
  text-align:center;
}
.nb-viz-hint-sm{
  margin-top:10px;
  font-size:9px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  opacity:0.65;
  user-select:none;
  text-align:center;
}
@keyframes nbHintFade{
  0%{opacity:0.35;}
  50%{opacity:0.75;}
  100%{opacity:0.35;}
}
</style>

<img
  id="harmImg"
  src="/wp-content/uploads/daily_harm/harmonograph.gif"
  alt="Daily harmonograph"
  style="
    max-width:100%;
    height:auto;
    border-radius:16px;
    display:block;
    margin:0 auto;
    cursor:pointer;
  "
/>

<script>
(function () {
  const img = document.getElementById("harmImg");
  if (!img) return;

  const link = "/harmonograph-learn"; // change this to your page

  function refreshImage(){
    img.src = "/wp-content/uploads/daily_harm/harmonograph.gif?v=" + Date.now();
  }

  // prevent browser cache on load
  refreshImage();

  img.addEventListener("click", function(){
    refreshImage();
    window.location.href = link;
  });

})();
</script>

<div class="nb-viz-hint">Daily Harmonograph</div>
<div class="nb-viz-hint-sm">(Click to learn more)</div>
