<div class="nb-quote-widget" style="display:block;">
  <div style="margin-bottom:6px;">
    <strong>Quote of the day:</strong>
  </div>

  <div style="min-height:1.4em; line-height:1.4;">
    <span class="nb-typed"></span>

    <span
      class="nb-cursor"
      style="
        display:inline-block;
        width:0.35em;
        height:1em;
        background:currentColor;
        margin-left:2px;
        vertical-align:-0.15em;
        opacity:1;
        transition:opacity 0.15s linear;
      "
    ></span>
  </div>

  <div style="margin-top:8px; text-align:right;">
    <a
      class="nb-learn"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      style="font-size:0.95rem; opacity:0.9; text-decoration:underline;"
    >
      Learn more
    </a>
  </div>
</div>

<script>
(function () {
  var root = document.querySelector(".nb-quote-widget");
  if (!root) return;

  var typedEl = root.querySelector(".nb-typed");
  var cursorEl = root.querySelector(".nb-cursor");
  var learnEl = root.querySelector(".nb-learn");

  if (!typedEl || !cursorEl || !learnEl) return;

  // Proof JS is running
  typedEl.textContent = "Loading quote…";

  function blinkCursor(times, interval) {
    var toggles = 0;
    var max = (times || 3) * 2;

    var timer = setInterval(function () {
      cursorEl.style.opacity =
        cursorEl.style.opacity === "0" ? "1" : "0";

      toggles++;

      if (toggles >= max) {
        clearInterval(timer);
        cursorEl.style.opacity = "0";
      }
    }, interval || 450);
  }

  function typeWriter(text, speed) {
    typedEl.textContent = "";
    cursorEl.style.opacity = "1";

    var i = 0;

    (function tick() {
      typedEl.textContent += text.charAt(i);
      i++;

      if (i < text.length) {
        setTimeout(tick, speed || 60);
      } else {
        blinkCursor(3, 450);
      }
    })();
  }

  var quoteUrl =
    window.location.origin +
    "/wp-content/uploads/daily_quote/today_quote.txt?v=" +
    Date.now();

  fetch(quoteUrl, { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (data) {
      var quote = (data || "").trim();
      typeWriter(quote || "No quote found for today.", 60);
    })
    .catch(function (err) {
      console.log("Quote fetch failed:", err);
      typedEl.textContent = "Could not load today's quote.";
      cursorEl.style.display = "none";
    });

  learnEl.addEventListener("click", function (e) {
    e.preventDefault();

    var text = (typedEl.textContent || "").trim();
    if (!text || text === "Loading quote…") return;

    // Search only the author (text after "—")
    var parts = text.split("—");
    var searchText = parts.length > 1 ? parts.pop().trim() : text;

    window.open(
      "https://www.google.com/search?q=" +
        encodeURIComponent(searchText),
      "_blank",
      "noopener"
    );
  });
})();
</script>
