name: Generate Daily Site Content

on:
  schedule:
    # GitHub cron uses UTC.
    # 07:00 UTC = midnight MST / 1 AM MDT.
    - cron: "0 7 * * *"

  # Allows manual testing from GitHub's Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-daily-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install Pillow

      - name: Generate daily content
        env:
          TZ: America/Denver
        run: |
          export HARM_DATE=$(date +%Y%m%d)
          python src/scripts/get_harm.py
          python src/scripts/get_quote.py

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/harmonographs/ public/daily-quote.json

          if git diff --cached --quiet; then
            echo "No daily content changes to commit."
            exit 0
          fi

          git commit -m "Generate daily site content"
          git push
